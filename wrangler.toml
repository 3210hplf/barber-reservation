name = "barber-reservation"
main = "server/worker.ts"
compatibility_date = "2026-10-30"
# Node.js compatibility is explicitly OFF: at this compatibility_date the
# Node.js APIs would otherwise be enabled by default. The Worker uses
# Web-standard APIs only (fetch / Request / Response / Web Crypto), so
# nothing depends on Node.js behavior at runtime.
compatibility_flags = ["no_nodejs_compat", "no_nodejs_compat_v2"]

# Built client (bun run build:client) served as Workers Static Assets.
[assets]
directory = "./client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "barber-db"
# Real D1 database id for barber-db (created in the owner's Cloudflare account).
database_id = "136a422f-ef9b-461d-b324-878a5c65ad65"
migrations_dir = "migrations"
