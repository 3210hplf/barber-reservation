<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f3350" />
    <meta name="description" content="理容室の予約・営業日カレンダー。ホーム画面に追加するとアプリのように使えます。" />
    <!-- PWA: ホーム画面に追加したときに全画面（standalone）で起動する -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="床屋予約" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>床屋の予約管理</title>
    <!-- build.mjs copies this file to client/dist/; the bundle and the
         generated stylesheet live next to it there. Asset URLs are absolute
         so they resolve from shop paths like /<slug>/owner as well. -->
    <link rel="stylesheet" href="/styles.css" />
    <script src="/main.js" type="module"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
